<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- ให้เนื้อหาเว้นขอบพื้นที่ notch/home-indicator บนมือถือได้ (viewport-fit=cover
         เปิดสิทธิ์ให้ใช้ env(safe-area-inset-*) ใน CSS) และสีแถบสถานะ/แถบ browser
         ตอนเปิดผ่านมือถือให้เข้ากับธีมแอปแทนสีขาว/ดำมาตรฐาน — ทำให้รู้สึกเหมือนแอป
         มากกว่าเว็บเพจทั่วไปตอนเปิดจากมือถือจริง -->
    <meta name="theme-color" content="#0f1512" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>riceOS — Smart Rice Platform</title>
    <script>
      // ตั้งธีมก่อน paint กันหน้าจอกระพริบ (no-flash)
      ;(function () {
        try {
          // dark เป็นโหมดหลัก: ใช้ dark เว้นแต่ผู้ใช้เลือก light ไว้เอง
          var saved = localStorage.getItem('theme')
          document.documentElement.dataset.theme =
            saved === 'light' ? 'light' : 'dark'
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
